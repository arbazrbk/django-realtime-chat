{% extends "base.html" %}
{% block title %}Log in · Realtime Chat{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</section>
{% endblock %}
